name: Inspect Build 16 Signing
on:
  push:
    branches: [codex/settings-source-repair]
    paths: ['.github/workflows/inspect-signing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-fast-probe-apk
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36528955257
      - name: Inspect actual Build 16 certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$(find previous -name '*.apk' -print -quit)"
