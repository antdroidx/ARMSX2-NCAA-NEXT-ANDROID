name: Fast ARMSX2 Runtime Probe

on:
  push:
    branches:
      - main
      - codex/settings-source-repair
    paths:
      - '.github/workflows/build-fast-probe.yml'
      - 'scripts/patch_crash_debugger.py'
      - 'scripts/patch_step_resolution_verify.py'
      - 'scripts/patch_settings_copy_verify_fix.py'
      - 'scripts/patch_achievements_settings_verify.py'
      - 'scripts/patch_configstore_settings_verify.py'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-previous-signing:
    name: Inspect Build 16 APK signer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-fast-probe-apk
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36528955257
      - name: Inspect actual Build 16 certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$(find previous -name '*.apk' -print -quit)"

  build-fast-probe:
    name: Build Fast Runtime Probe APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out probe project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Test validation scripts
        run: python3 -m unittest discover -s tests -v

      - name: Install pinned APK inspection tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Download Build 16 for update compatibility validation
        uses: actions/download-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-fast-probe-apk
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36528955257

      - name: Download ARMSX2 source
        run: |
          set -euxo pipefail
          curl -L "https://github.com/SgtBilko76/ARMSX2-3D/archive/f4904cb5e3b322178e3815683e221f3ab9354d2e.zip" -o armsx2.zip
          unzip -q armsx2.zip
          mv ARMSX2-3D-f4904cb5e3b322178e3815683e221f3ab9354d2e src

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-armsx2-f4904cb5-${{ hashFiles('src/platforms/android/**/*.gradle*', 'src/platforms/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-armsx2-f4904cb5-

      - name: Download known-good native cores from Run 6
        uses: actions/download-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-test-apk
          path: prebuilt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36368317970

      - name: Stage all prebuilt native libraries from Run 6
        run: |
          set -euxo pipefail
          APK="$(find prebuilt -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          JNI="src/platforms/android/app/src/main/jniLibs/arm64-v8a"
          TMP_NATIVE="$(mktemp -d)"
          mkdir -p "$JNI"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$TMP_NATIVE"
          cp -f "$TMP_NATIVE"/lib/arm64-v8a/*.so "$JNI"/
          test -s "$JNI/libemucore_4k.so"
          test -s "$JNI/libemucore_16k.so"
          test -s "$JNI/libc++_shared.so"
          test -s "$JNI/libshaderc_shared.so"
          test -s "$JNI/libSPIRV-Tools-shared.so"
          test -s "$JNI/liblibrashader_capi.so"
          COUNT="$(find "$JNI" -maxdepth 1 -type f -name '*.so' | wc -l)"
          echo "Staged $COUNT native libraries"
          test "$COUNT" -ge 15
          ls -lh "$JNI"/*.so

      - name: Fix Settings.copy DEX verifier hazards
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_settings_copy_verify_fix.py
          grep -n "Settings has >255 constructor fields" platforms/android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt

      - name: Fix Achievements Settings.copy verifier hazards
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_achievements_settings_verify.py
          grep -n "Android 17 verifier fix" platforms/android/app/src/main/java/com/armsx2/ui/achievements/AchievementsViewModel.kt

      - name: Fix global Settings/ConfigStore verifier hazards
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_configstore_settings_verify.py
          grep -n "Android/Dex-safe Settings update path" platforms/android/app/src/main/java/com/armsx2/config/Settings.kt
          grep -n "Settings.fromJson(JSONObject())" platforms/android/app/src/main/java/com/armsx2/config/ConfigStore.kt | head

      - name: Apply verifier-safe stepResolution patch
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_step_resolution_verify.py
          grep -n "verifier-safe implementation" platforms/android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt

      - name: Apply on-device crash debugger
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_crash_debugger.py
          grep -n "NCAA NEXT CRASH DEBUGGER" platforms/android/app/src/main/java/com/armsx2/BootSplashActivity.kt

      - name: Restore stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/ncaa-next-debug.jks
          key: ncaa-next-debug-signing-v1

      - name: Prepare stable debug signing key
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/ncaa-next-debug.jks" ]]; then
            echo "::error::Build 16 signing key unavailable. Restore the original key; do not generate a replacement."
            exit 1
          fi
          CERT="$(keytool -exportcert -keystore "$HOME/.android/ncaa-next-debug.jks" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          test "$CERT" = "599891bb2245e9c90237c41e7066889cb9c28e11c2f8b5d6af75b10cad3a783f"
          cp -f "$HOME/.android/ncaa-next-debug.jks" "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Owner:"

      - name: Bind Gradle to the restored signing key
        working-directory: src
        run: python3 ../scripts/patch_android_signing.py

      - name: Stage Settings frontend regression tests
        run: |
          mkdir -p src/platforms/android/app/src/test/java/com/armsx2/config
          cp tests/SettingsFrontendTest.kt src/platforms/android/app/src/test/java/com/armsx2/config/

      - name: Build APK without recompiling native core
        working-directory: src/platforms/android
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleGithubDebug :app:testGithubDebugUnitTest --tests com.armsx2.config.SettingsFrontendTest             -x ':app:configureCMakeDebug[arm64-v8a]'             -x ':app:buildCMakeDebug[arm64-v8a]'             -Parmsx2.applicationId=com.armsx2.ncaanext             -Parmsx2.versionCode=128015             -Parmsx2.versionName=0.1.9-settings-source-constructor-fix             -Parmsx2.hostPageSize=0x1000             -Parmsx2.nativeLibName=emucore_4k             --stacktrace

      - name: Audit compiled Settings bytecode
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/audit_settings_bytecode.py

      - name: Verify and collect APK
        run: |
          set -euxo pipefail
          APK="src/platforms/android/app/build/outputs/apk/github/debug/app-github-debug.apk"
          test -f "$APK"
          python3 scripts/validate_apk.py "$APK" \
            --previous "$(find previous -name '*.apk' -print -quit)" \
            --native-base "$(find prebuilt -name '*.apk' -print -quit)" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --report out/validation-report.json
          cp "$APK" out/ARMSX2-NCAA-NEXT-ANDROID-RUNTIME-PROBE-fast-debug.apk
          sha256sum out/ARMSX2-NCAA-NEXT-ANDROID-RUNTIME-PROBE-fast-debug.apk > out/ARMSX2-NCAA-NEXT-ANDROID-RUNTIME-PROBE-fast-debug.apk.sha256

      - name: Compile standalone ART smoke harness
        run: |
          mkdir -p work/art-classes
          javac --release 8 -d work/art-classes tests/SettingsArtSmoke.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 26 --output work/art-smoke.jar work/art-classes/SettingsArtSmoke.class

      - name: Enable KVM for ART test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Settings on Android ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/run_art_smoke.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-fast-probe-apk
          path: out/*
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-frontend-test-results
          path: |
            src/platforms/android/app/build/reports/tests/
            src/platforms/android/app/build/test-results/
            out/art-*.log
            out/art-logcat.txt
          if-no-files-found: ignore

