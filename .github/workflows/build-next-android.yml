name: Full ARMSX2 NCAA NEXT Native Build

on:
  workflow_dispatch:
    inputs:
      enhancements:
        description: 'Isolated test variant (baseline first)'
        type: choice
        default: cpu-audio
        options:
          - none
          - cpu
          - cpu-audio
      validate_only:
        description: 'Run source/host checks without compiling an APK'
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test native stop ownership
        run: python3 -m unittest discover -s tests -v

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: yes | sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "cmake;3.31.6" >/dev/null || true

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Restore native compiler cache
        if: inputs.validate_only != true
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-armsx2-f4904cb5-4k-${{ github.run_id }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-armsx2-f4904cb5-4k-

      - name: Download ARMSX2 source
        run: |
          set -euxo pipefail
          curl -L "https://github.com/SgtBilko76/ARMSX2-3D/archive/f4904cb5e3b322178e3815683e221f3ab9354d2e.zip" -o armsx2.zip
          unzip -q armsx2.zip
          mv ARMSX2-3D-f4904cb5e3b322178e3815683e221f3ab9354d2e src

      - name: Apply ARMSX2 Extended branding
        working-directory: src
        run: python3 ../scripts/patch_extended_branding.py

      - name: Restore known-good frontend fixes
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_renderer_layout.py
          python3 ../scripts/patch_settings_copy_verify_fix.py
          python3 ../scripts/patch_achievements_settings_verify.py
          python3 ../scripts/patch_texture_mode_settings.py
          python3 ../scripts/patch_configstore_settings_verify.py
          python3 ../scripts/patch_step_resolution_verify.py
          python3 ../scripts/patch_crash_debugger.py
          python3 ../scripts/patch_game_exit.py
          python3 ../scripts/patch_no_intro.py
          python3 ../scripts/verify_lifecycle_source.py
          python3 ../scripts/patch_native_stop.py
          grep -n "Android/Dex-safe Settings update path" platforms/android/app/src/main/java/com/armsx2/config/Settings.kt
          grep -n "NCAA NEXT CRASH DEBUGGER" platforms/android/app/src/main/java/com/armsx2/BootSplashActivity.kt

      - name: Restore production signing key from encrypted secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NCAA_NEXT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NCAA_NEXT_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/ncaa-next-release.p12"
          CERT="$(keytool -exportcert -keystore "$HOME/.android/ncaa-next-release.p12" -storepass:env STORE_PASSWORD -alias ncaanext | sha256sum | cut -d' ' -f1)"
          test "$CERT" = "d2630f9d724968df1fb562343e57c0bcfad905755621dc12ee2af23d31b07cb3"
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('src/platforms/android/armsx2_keystore.properties').write_text(
              f"storeFile={Path.home()}/.android/ncaa-next-release.p12\n"
              f"storePassword={os.environ['STORE_PASSWORD']}\n"
              "keyAlias=ncaanext\n"
              f"keyPassword={os.environ['STORE_PASSWORD']}\n")
          PY

      - name: Configure compiler cache
        working-directory: src
        run: python3 ../scripts/patch_ccache.py

      - name: Apply NEXT 128MB ARM64 patch
        working-directory: src
        run: |
          set -euxo pipefail
          cat > /tmp/patch_next128.py <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              ns = fn(s)
              if ns == s:
                  raise SystemExit(f"No change made to {path}")
              p.write_text(ns)

          def repl(s, old, new, label):
              if old not in s:
                  raise SystemExit(f"Missing block for {label}")
              return s.replace(old, new, 1)

          def patch_ir5900(s):
              s = repl(s,
                  "static u16 manual_page[Ps2MemSize::MainRam / 4096] = {};\nstatic u8 manual_counter[Ps2MemSize::MainRam / 4096] = {};",
                  "static u16 manual_page[Ps2MemSize::TotalRam / 4096] = {};\nstatic u8 manual_counter[Ps2MemSize::TotalRam / 4096] = {};",
                  "manual SMC arrays")
              s = repl(s,
                  "recLutEntries = (Ps2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;",
                  "recLutEntries = (Ps2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;",
                  "recLutEntries")
              s = repl(s,
                  "curpos += (Ps2MemSize::MainRam / 4);",
                  "curpos += (Ps2MemSize::ExposedRam / 4);",
                  "recRAM advance")
              s = re.sub(
                  r"\n\t// MainRam, deliberately .*?\n\tif \(recRAMCopy\.size\(\) != Ps2MemSize::MainRam\)\n\t\trecRAMCopy\.resize\(Ps2MemSize::MainRam\);",
                  "\n\t// Keep the ARM64 snapshot/LUT span synchronized with the amount of EE RAM\n"
                  "\t// exposed to the guest. This mirrors the x86 recompiler and is required for\n"
                  "\t// executing blocks from the 32-128MB devkit region.\n"
                  "\tif (recRAMCopy.size() != Ps2MemSize::ExposedRam)\n"
                  "\t\trecRAMCopy.resize(Ps2MemSize::ExposedRam);",
                  s,
                  count=1,
                  flags=re.S)
              s = repl(s,
                  "iopClearRecLUT(recLutReserve_RAM.data(),\n\t\tPs2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);",
                  "iopClearRecLUT(recLutReserve_RAM.data(),\n\t\tPs2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);",
                  "clear recLUT size")
              old_map = ("\t// Map EE RAM (32MB, mirrored)\n"
                  "\tfor (int i = 0; i < 0x200; i++)\n"
                  "\t{\n"
                  "\t\tu32 mask = (Ps2MemSize::MainRam / _64kb) - 1;\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x0000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x2000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x3000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x8000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xa000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xb000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xc000, i, i & mask);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xd000, i, i & mask);\n"
                  "\t}\n")
              new_map = ("\t// Map all exposed EE RAM (32MB retail or 128MB devkit), mirrored.\n"
                  "\tfor (int i = 0; i < static_cast<int>(Ps2MemSize::ExposedRam / _64kb); i++)\n"
                  "\t{\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x0000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x2000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x3000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x8000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xa000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xb000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xc000, i, i);\n"
                  "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xd000, i, i);\n"
                  "\t}\n")
              s = repl(s, old_map, new_map, "EE RAM recLUT mapping")
              s = repl(s, "if (HWADDR(pc) <= Ps2MemSize::MainRam)", "if (HWADDR(pc) <= Ps2MemSize::ExposedRam)", "overlap walk bound")
              s = repl(s, "Ps2MemSize::MainRam - oldBlock->startpc", "Ps2MemSize::ExposedRam - oldBlock->startpc", "snapshot clamp")
              if "Ps2MemSize::MainRam" in s:
                  raise SystemExit("iR5900-arm64.cpp still contains Ps2MemSize::MainRam")
              return s
          edit("pcsx2/arm64/iR5900-arm64.cpp", patch_ir5900)

          def patch_memory(s):
              s = repl(s, "u32 ExposedRam = MainRam;", "u32 ExposedRam = TotalRam;", "default ExposedRam")
              s = repl(s, "u32 ExposedIopRam = IopRam;", "u32 ExposedIopRam = TotalIopRam;", "default ExposedIopRam")
              s = repl(s, "static bool s_extra_memory = false;", "static bool s_extra_memory = true;", "default extra memory")
              s = re.sub(
                  r"void memSetExtraMemMode\(bool mode\)\n\{.*?\n\ts_extra_memory = mode;",
                  "void memSetExtraMemMode(bool mode)\n{\n\t// NEXT 27 test build: hard-enable devkit RAM even if settings contain false.\n\tmode = true;\n\ts_extra_memory = mode;",
                  s,
                  count=1,
                  flags=re.S)
              if "not supported by the ARM64 EE recompiler" in s:
                  raise SystemExit("ARM64 extra-memory refusal guard still present")
              return s
          edit("pcsx2/Memory.cpp", patch_memory)
          edit("pcsx2/Pcsx2Config.cpp", lambda s: repl(s, "ExtraMemory = false;", "ExtraMemory = true;", "CPU default ExtraMemory"))

          # Diagnostic build #2: keep the ARM64 EE recompiler enabled, but force
          # all EE memory ops through VTLB softmem. This isolates the remaining
          # 128MB problem from the 4GB ARM64 fastmem mapping/backpatch path.
          edit("pcsx2/Config.h", lambda s: repl(
              s,
              "#define CHECK_FASTMEM (EmuConfig.Cpu.Recompiler.EnableEE && EmuConfig.Cpu.Recompiler.EnableFastmem)",
              "#define CHECK_FASTMEM (false)",
              "force EE softmem"))
          edit("pcsx2/Pcsx2Config.cpp", lambda s: repl(
              s, "EnableFastmem = true;", "EnableFastmem = false;", "default fastmem off"))

          gradle = Path("platforms/android/app/build.gradle.kts")
          txt = gradle.read_text().replace('version = "3.22.1"', 'version = "3.31.6"')
          gradle.write_text(txt)
          PY
          python3 /tmp/patch_next128.py

          grep -n "Ps2MemSize::MainRam" pcsx2/arm64/iR5900-arm64.cpp && exit 1 || true
          grep -n "not supported by the ARM64 EE recompiler" pcsx2/Memory.cpp && exit 1 || true


      - name: Apply 64MB folder memory card geometry
        working-directory: src
        run: |
          set -euxo pipefail
          python3 ../scripts/patch_folder_memcard_64mb.py
          grep -n "NCAA_NEXT_FOLDER_CARD_MB = 64" pcsx2/SIO/Memcard/MemoryCardFolder.cpp

      - name: Apply per-game texture replacement methods
        working-directory: src
        run: |
          python3 ../scripts/prepare_texture_modes.py
          python3 ../scripts/verify_texture_modes.py

      - name: Apply verified alpha correction and cover-launch compatibility
        working-directory: src
        run: |
          set -euo pipefail
          python3 ../scripts/patch_atlas_alpha.py
          python3 ../scripts/patch_cover_launch_128111.py
          python3 ../scripts/verify_atlas_alpha.py

      - name: Cache replacement texture filenames
        working-directory: src
        run: |
          python3 ../scripts/patch_texture_index_cache.py
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -fno-exceptions -Wall -Wextra -Werror \
            -I pcsx2/GS/Renderers/HW -c ../tests/texture_index_harness.cpp -o /tmp/texture-index-android.o

      - name: Apply and verify conservative GS optimizations
        working-directory: src
        run: |
          python3 ../scripts/patch_conservative_gs.py
          python3 ../scripts/verify_conservative_gs.py

      - name: Optimize and verify texture streaming
        working-directory: src
        run: |
          python3 ../scripts/patch_texture_streaming.py
          python3 ../scripts/verify_texture_streaming.py

      - name: Apply NCAA filtering defaults and Vulkan sampler efficiency
        working-directory: src
        run: |
          python3 -m pip install --quiet PyYAML
          python3 ../scripts/patch_ncaa_presets.py
          python3 ../scripts/verify_ncaa_presets.py
          python3 ../scripts/patch_vulkan_samplers.py
          python3 ../scripts/verify_vulkan_samplers.py

      - name: Fetch shaderc third-party deps
        if: inputs.validate_only != true
        working-directory: src/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Apply optional selective enhancements
        if: github.event_name == 'push' || inputs.enhancements == 'cpu' || inputs.enhancements == 'cpu-audio'
        working-directory: src
        env:
          ENHANCEMENTS: ${{ github.event_name == 'push' && 'cpu-audio' || inputs.enhancements }}
        run: |
          set -euo pipefail
          git -C .. apply --check --directory=src patches/arm64-selective.patch
          git -C .. apply --verbose --directory=src patches/arm64-selective.patch
          if [ "$ENHANCEMENTS" = cpu-audio ]; then
            git -C .. apply --check --directory=src patches/oboe-safe-bursts.patch
            git -C .. apply --verbose --directory=src patches/oboe-safe-bursts.patch
            python3 ../scripts/test_selective_source.py
          fi

      - name: Apply and test graphics, cache, audio, and VIF efficiencies
        if: inputs.enhancements == 'cpu-audio'
        working-directory: src
        run: |
          python3 ../scripts/patch_core_efficiency.py
          python3 ../scripts/patch_vif_pairs.py
          python3 ../scripts/verify_core_efficiency.py
          python3 ../scripts/verify_vif_pairs.py

      - name: Build production 4K release APK
        if: inputs.validate_only != true
        working-directory: src/platforms/android
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ENHANCEMENTS: ${{ github.event_name == 'push' && 'cpu-audio' || inputs.enhancements || 'none' }}
        run: |
          set -euxo pipefail
          mkdir -p "$PWD/../../../out"
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          BUILD_START=$(date +%s)

          # Android update ordering is independent of the public release label.
          VERSION_CODE=128121
          case "$ENHANCEMENTS" in
            none) VERSION_NAME=0.2.5-RC4-test4-stopcpu; VARIANT=STOPCPU ;;
            cpu) VERSION_NAME=0.2.5-RC4-test4-cpu; VARIANT=CPU ;;
            cpu-audio) VERSION_NAME=0.2.5-RC4-test4; VARIANT=CPU-AUDIO ;;
            *) exit 1 ;;
          esac
          printf 'commit=%s\nvariant=%s\nversionCode=%s\nversionName=%s\n' "$GITHUB_SHA" "$VARIANT" "$VERSION_CODE" "$VERSION_NAME" > "$PWD/../../../out/build-info.txt"

          ./gradlew :app:assembleGithubRelease \
            -Parmsx2.applicationId=com.armsx2.ncaanext \
            '-Parmsx2.appLabel=ARMSX2 Extended' \
            -Parmsx2.versionCode="$VERSION_CODE" \
            -Parmsx2.versionName="$VERSION_NAME" \
            -Parmsx2.hostPageSize=0x1000 \
            -Parmsx2.nativeLibName=emucore_4k \
            --stacktrace

          BUILT_APK="$PWD/app/build/outputs/apk/github/release/app-github-release.apk"
          FINAL_APK="$PWD/../../../out/ARMSX2-NCAA-NEXT-ANDROID-${VARIANT}-4K-release.apk"
          test -f "$BUILT_APK"
          cp -f "$BUILT_APK" "$FINAL_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" | tee "$PWD/../../../out/apk-signature.txt"
          grep -q 'd2630f9d724968df1fb562343e57c0bcfad905755621dc12ee2af23d31b07cb3' "$PWD/../../../out/apk-signature.txt"
          python3 "$PWD/../../../scripts/audit_settings_bytecode.py" "$PWD/app/build"
          python3 "$PWD/../../../scripts/verify_extended_apk.py" "$FINAL_APK" "$(dirname "$APKSIGNER")"
          echo "Build seconds: $(($(date +%s) - BUILD_START))" | tee "$PWD/../../../out/build-time.txt"
          ccache --show-stats --verbose | tee "$PWD/../../../out/ccache-stats.txt"
          find app/.cxx -name CMakeCache.txt -exec grep -H 'CMAKE_.*_COMPILER_LAUNCHER' {} \; | tee "$PWD/../../../out/compiler-launchers.txt"
          test -s "$PWD/../../../out/compiler-launchers.txt"
          sha256sum "$FINAL_APK" > "$FINAL_APK.sha256"

      - name: Collect APK
        if: inputs.validate_only != true
        run: |
          set -euxo pipefail
          ls -lh out/
          test "$(find out -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find out -maxdepth 1 -name '*.apk.sha256' | wc -l)" -eq 1

      - name: Upload APK artifact
        if: inputs.validate_only != true
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-NCAA-NEXT-ANDROID-${{ github.event_name == 'push' && 'cpu-audio' || inputs.enhancements || 'none' }}-production-apk
          path: out/*
          retention-days: 3
          if-no-files-found: error
